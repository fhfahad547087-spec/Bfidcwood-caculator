<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFIDC WOOD HISAB</title>
    <link href="https://fonts.maateen.me/nikosh/font.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nikosh', 'Segoe UI', Arial, sans-serif; }
        body { background: #f1f5f9; padding: 15px; font-size: 18px; color: #000; }
        .wrapper { max-width: 850px; margin: 0 auto; background: #fff; padding: 25px; border: 1.5px solid #000; }
        
        .header-box { text-align: center; border-bottom: 2px solid #000; padding-bottom: 12px; margin-bottom: 15px; }
        .header-box h2 { font-size: 24px; font-weight: bold; margin-bottom: 4px; }
        .header-box p { font-size: 19px; line-height: 1.4; }
        .garden-tag { font-weight: bold; text-decoration: underline; }
        
        .entry-box { background: #f8fafc; border: 1px solid #94a3b8; padding: 15px; margin-bottom: 20px; }
        .input-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
        .field { flex: 1; min-width: 140px; display: flex; flex-direction: column; }
        .field label { font-size: 16px; font-weight: bold; margin-bottom: 3px; }
        .field input { padding: 10px; font-size: 18px; border: 1px solid #64748b; border-radius: 3px; outline: none; }
        .field input:focus { border-color: #1b4332; background: #fff; box-shadow: 0 0 4px rgba(27,67,50,0.4); }
        
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
        button { cursor: pointer; padding: 10px 16px; font-size: 17px; font-weight: bold; border-radius: 3px; border: 1px solid #333; }
        .btn-add { background: #1b4332; color: #fff; border: none; }
        .btn-word { background: #1e40af; color: #fff; border: none; }
        .btn-print { background: #e2e8f0; }
        .btn-clear { background: #fee2e2; color: #b91c1c; border-color: #f87171; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1.5px solid #000; padding: 6px 10px; text-align: center; font-size: 19px; }
        th { background: #f1f5f9; font-weight: bold; }
        .total-title { text-align: right; font-weight: bold; padding-right: 15px; }
        .total-val { text-align: left; font-weight: bold; padding-left: 15px; }
        .del-btn { background: none; border: none; color: red; font-size: 16px; cursor: pointer; }
        
        @media print {
            body { padding: 0; background: #fff; }
            .wrapper { border: none; padding: 0; width: 100%; }
            .entry-box, .btn-row, .del-col { display: none !important; }
            th, td { border: 1px solid #000 !important; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header-box">
        <h2>BFIDC FINAL ERP</h2>
        <p>বাংলাদেশ বন শিল্প উন্নয়ন কর্পোরেশন, <span id="gardenNameText" class="garden-tag">রাউজান</span> রাবার বাগান হতে বিএফআইডিসি, এলপিসি, কাপ্তাই <br>
        প্রেরণের জন্য কর্তনকৃত জীবনচক্র হারানো রাবার কাঠের সাইজ লিস্ট।</p>
    </div>

    <!-- ইনপুট ফরম -->
    <div class="entry-box">
        <div class="input-row">
            <div class="field">
                <label>বাগানের নাম:</label>
                <input type="text" id="gardenInput" value="রাউজান" oninput="changeGarden()" onkeydown="handleEnter(event, 'pieceNo')">
            </div>
            <div class="field">
                <label>গাছ/পিস:</label>
                <input type="text" id="pieceNo" value="1/1" autocomplete="off" onkeydown="handleEnter(event, 'girth')">
            </div>
            <div class="field">
                <label>বেড় (ইঞ্চি):</label>
                <input type="number" id="girth" placeholder="বেড়" step="any" onkeydown="handleEnter(event, 'length')">
            </div>
            <div class="field">
                <label>লম্বা (ফুট):</label>
                <input type="number" id="length" placeholder="লম্বা" step="any" onkeydown="handleEnterLength(event)">
            </div>
        </div>
        <div class="btn-row">
            <button class="btn-add" id="addBtn" onclick="addNewSize()">+ লিস্টে যোগ করুন</button>
            <button class="btn-word" onclick="saveToWord()">📄 Word ফাইল সেভ</button>
            <button class="btn-print" onclick="window.print()">🖨️ প্রিন্ট / PDF</button>
            <button class="btn-clear" onclick="clearList()">তালিকা মুছুন</button>
        </div>
    </div>

    <!-- সাইজ টেবিল -->
    <table>
        <thead>
            <tr>
                <th style="width: 25%;">গাছ/পিস</th>
                <th style="width: 40%;">সাইজ</th>
                <th style="width: 25%;">সিএফটি</th>
                <th style="width: 10%;" class="del-col">মুছুন</th>
            </tr>
        </thead>
        <tbody id="listBody"></tbody>
        <tfoot>
            <tr>
                <td class="total-title" colspan="2">মোট গাছ:</td>
                <td class="total-val" id="dispTotalTrees">০ টি</td>
                <td class="del-col"></td>
            </tr>
            <tr>
                <td class="total-title" colspan="2">মোট পিস:</td>
                <td class="total-val" id="dispTotalPieces">০ টি</td>
                <td class="del-col"></td>
            </tr>
            <tr>
                <td class="total-title" colspan="2">মোট সিএফটি:</td>
                <td class="total-val" id="dispTotalCFT">0.00</td>
                <td class="del-col"></td>
            </tr>
        </tfoot>
    </table>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('bfidc_simple_logs')) || [];
    let garden = localStorage.getItem('bfidc_simple_garden') || 'রাউজান';

    document.getElementById('gardenInput').value = garden;
    document.getElementById('gardenNameText').innerText = garden;

    function handleEnter(e, nextId) {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById(nextId).focus();
        }
    }

    function handleEnterLength(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            addNewSize();
        }
    }

    function changeGarden() {
        const val = document.getElementById('gardenInput').value.trim() || '................';
        document.getElementById('gardenNameText').innerText = val;
        localStorage.setItem('bfidc_simple_garden', val);
    }

    // দশমিকের পর ২ ঘর রাখা (কোনো রাউন্ডিং ছাড়াই)
    function truncateToTwoDecimals(num) {
        // ২.২৬৬২৫ কে ১০০ দিয়ে গুণ করলে ২২৬.৬২৫ হয়, ফ্লোর করলে ২২৬ হয়, তারপর ১০০ দিয়ে ভাগ করলে ২.২৬ হয়
        return (Math.floor(num * 100) / 100).toFixed(2);
    }

    function addNewSize() {
        const pNoField = document.getElementById('pieceNo');
        const girthField = document.getElementById('girth');
        const lengthField = document.getElementById('length');

        const pNo = pNoField.value.trim();
        const g = parseFloat(girthField.value);
        const l = parseFloat(lengthField.value);

        if (!pNo || isNaN(g) || isNaN(l) || g <= 0 || l <= 0) {
            alert('সঠিক মাপ দিন!');
            return;
        }

        // CFT Formula: (Girth * Girth * Length) / 2304
        const rawCft = (g * g * l) / 2304;
        const formattedCft = truncateToTwoDecimals(rawCft);

        records.push({
            pNo: pNo,
            size: `${g}" × ${l}'`,
            cft: formattedCft
        });

        // পিস নম্বর বাড়ানো (১/১ -> ১/২)
        let parts = pNo.split('/');
        if (parts.length === 2 && !isNaN(parts[1])) {
            pNoField.value = parts[0] + '/' + (parseInt(parts[1]) + 1);
        }

        girthField.value = '';
        lengthField.value = '';

        // লিস্টে যোগ হওয়ার পর কার্সর গাছ/পিস বক্সে যাবে
        pNoField.focus();

        saveAndRender();
    }

    function removeRow(idx) {
        records.splice(idx, 1);
        saveAndRender();
    }

    function clearList() {
        if (records.length && confirm('সব মুছবেন?')) {
            records = [];
            saveAndRender();
            document.getElementById('pieceNo').value = '1/1';
        }
    }

    function saveAndRender() {
        localStorage.setItem('bfidc_simple_logs', JSON.stringify(records));
        const tbody = document.getElementById('listBody');
        tbody.innerHTML = '';

        const treeSet = new Set();
        let totalCft = 0;

        records.forEach((item, idx) => {
            const rootTree = item.pNo.split('/')[0].trim();
            if (rootTree) treeSet.add(rootTree);
            totalCft += parseFloat(item.cft);

            tbody.innerHTML += `
                <tr>
                    <td>${item.pNo}</td>
                    <td>${item.size}</td>
                    <td><b>${item.cft}</b></td>
                    <td class="del-col"><button class="del-btn" onclick="removeRow(${idx})">✕</button></td>
                </tr>
            `;
        });

        document.getElementById('dispTotalTrees').innerText = treeSet.size + ' টি';
        document.getElementById('dispTotalPieces').innerText = records.length + ' টি';
        document.getElementById('dispTotalCFT').innerText = totalCft.toFixed(2);
    }

    function saveToWord() {
        if (!records.length) return;
        const gardenName = document.getElementById('gardenNameText').innerText;
        let rows = '';
        records.forEach(item => {
            rows += `<tr>
                <td style="border:1px solid #000; text-align:center;">${item.pNo}</td>
                <td style="border:1px solid #000; text-align:center;">${item.size}</td>
                <td style="border:1px solid #000; text-align:center;">${item.cft}</td>
            </tr>`;
        });

        const htmlDoc = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head><meta charset='utf-8'></head>
            <body style="font-family:'Nikosh', Arial; text-align:center;">
                <h2>BFIDC WOOD LIST</h2>
                <p>বাগান: ${gardenName}</p>
                <table style="width:100%; border-collapse:collapse;">
                    <thead><tr style="background:#eee;"><th>গাছ/পিস</th><th>সাইজ</th><th>সিএফটি</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            </body></html>`;

        const blob = new Blob(['\ufeff' + htmlDoc], { type: 'application/msword' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Wood_List_${gardenName}.doc`;
        a.click();
    }

    window.onload = saveAndRender;
</script>

</body>
</html>
