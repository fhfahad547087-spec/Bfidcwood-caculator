<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFIDC WOOD MEASUREMENT LIST</title>
    <link href="https://fonts.maateen.me/nikosh/font.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nikosh', sans-serif; }
        body { background: #f0f2f5; padding: 10px; color: #000; }

        /* A4 Setup */
        .wrapper { 
            width: 210mm; 
            min-height: 297mm; 
            margin: 0 auto; 
            background: #fff; 
            padding: 15mm; 
            border: 1px solid #ccc;
            position: relative;
            overflow: hidden; /* Watermark বাইরে যাবে না */
        }

        /* Watermark Logo */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px; /* লোগোর সাইজ */
            opacity: 0.15; /* ২৫% বা তার কম ওপাসিটি (টেক্সট পড়ার সুবিধার জন্য ১৫% রাখা হয়েছে) */
            z-index: 0;
            pointer-events: none;
        }

        .header-section { text-align: center; margin-bottom: 10px; position: relative; z-index: 1; }
        .header-section h2 { font-size: 20px; font-weight: bold; text-decoration: underline; }
        
        .meta-info { display: flex; justify-content: space-between; margin-top: 15px; font-size: 17px; font-weight: bold; position: relative; z-index: 1; }
        .meta-info div { flex: 1; }

        /* Table CSS */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; position: relative; z-index: 1; background: transparent; }
        th, td { border: 1px solid #000; padding: 4px 2px; text-align: center; font-size: 14px; overflow: hidden; }
        th { background: #e2e2e2; font-weight: bold; }

        /* Input Panel (Hidden on Print) */
        .input-panel { 
            max-width: 900px; margin: 20px auto; background: #fff; padding: 20px; 
            border-radius: 8px; border: 2px solid #1b4332; box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        .input-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .field { flex: 1; min-width: 120px; display: flex; flex-direction: column; }
        .field label { font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #333; }
        .field input { padding: 8px; border: 1px solid #999; border-radius: 4px; font-size: 16px; outline: none; }
        .field input:focus { border-color: #1b4332; box-shadow: 0 0 5px rgba(27,67,50,0.3); }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        button { cursor: pointer; padding: 8px 15px; font-weight: bold; border-radius: 4px; border: none; font-size: 14px; }
        .btn-add { background: #1b4332; color: white; }
        .btn-print { background: #333; color: white; }
        .btn-save { background: #1e40af; color: white; }
        .btn-open { background: #ca8a04; color: white; }
        .btn-clear { background: #d90429; color: white; }

        /* Totals Area */
        .totals-footer { 
            margin-top: 20px; 
            font-weight: bold; 
            font-size: 18px; 
            border-top: 2px solid #000; 
            padding-top: 10px;
            position: relative; z-index: 1;
        }

        @media print {
            body { background: none; padding: 0; }
            .input-panel, .del-btn { display: none !important; }
            .wrapper { border: none; padding: 10mm; width: 100%; margin: 0; }
            @page { size: A4; margin: 0; }
        }

        .del-btn { background: none; border: none; color: red; cursor: pointer; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

<!-- Input Section -->
<div class="input-panel">
    <div class="input-row">
        <div class="field">
            <label>বাগানের নাম:</label>
            <input type="text" id="gardenInput" value="দাঁতমারা" oninput="updateHeader()" onkeydown="handleEnter(event, 'sutraInput')">
        </div>
        <div class="field">
            <label>সূত্র:</label>
            <input type="text" id="sutraInput" placeholder="সূত্র" oninput="updateHeader()" onkeydown="handleEnter(event, 'dateInput')">
        </div>
        <div class="field">
            <label>তারিখ:</label>
            <input type="text" id="dateInput" placeholder="তারিখ" oninput="updateHeader()" onkeydown="handleEnter(event, 'truckInput')">
        </div>
        <div class="field">
            <label>ট্রাক নং:</label>
            <input type="text" id="truckInput" placeholder="ট্রাক নং" oninput="updateHeader()" onkeydown="handleEnter(event, 'pieceNo')">
        </div>
    </div>
    <div class="input-row">
        <div class="field">
            <label>গাছের নম্বর/পিস:</label>
            <input type="text" id="pieceNo" value="1/1" onkeydown="handleEnter(event, 'girth')">
        </div>
        <div class="field">
            <label>বেড় (ইঞ্চি):</label>
            <input type="number" id="girth" step="any" onkeydown="handleEnter(event, 'length')">
        </div>
        <div class="field">
            <label>লম্বা (ফুট):</label>
            <input type="number" id="length" step="any" onkeydown="handleEnterLength(event)">
        </div>
    </div>
    <div class="btn-group">
        <button class="btn-add" onclick="addNewSize()">+ লিস্টে যোগ করুন</button>
        <button class="btn-save" onclick="saveDataFile()">💾 ফাইল সেভ করুন</button>
        <button class="btn-open" onclick="document.getElementById('fileOpener').click()">📂 ফাইল ওপেন করুন</button>
        <button class="btn-print" onclick="window.print()">🖨️ প্রিন্ট করুন</button>
        <button class="btn-clear" onclick="clearList()">তালিকা ক্লিয়ার</button>
        <input type="file" id="fileOpener" style="display:none" accept=".json" onchange="openDataFile(event)">
    </div>
</div>

<!-- A4 Page Content -->
<div class="wrapper">
    <!-- Watermark Logo -->
    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/5/52/Bangladesh_Forest_Industries_Development_Corporation_logo.svg/1024px-Bangladesh_Forest_Industries_Development_Corporation_logo.svg.png" class="watermark" alt="Logo">

    <div class="header-section">
        <h2>বিএফআইডিসি, <span id="gardenLabel">দাঁতমারা</span> রাবার বাগানের জীবনচক্র হারানো রাবার গাছের পরিমাপকৃত সাইজ লিস্ট</h2>
    </div>

    <div class="meta-info">
        <div>সূত্র : <span id="sutraLabel">........</span></div>
        <div style="text-align: center;">তারিখ: <span id="dateLabel">........</span></div>
        <div style="text-align: right;">ট্রাক নং: <span id="truckLabel">........</span></div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 7%;">ক্রমিক</th>
                <th style="width: 13%;">গাছের নম্বর</th>
                <th style="width: 14%;">পরিমাপ</th>
                <th style="width: 10%;">ঘনফুট</th>
                <th style="width: 7%;">ক্রমিক</th>
                <th style="width: 13%;">গাছের নম্বর</th>
                <th style="width: 14%;">পরিমাপ</th>
                <th style="width: 10%;">ঘনফুট</th>
                <th style="width: 12%;">মন্তব্য</th>
            </tr>
        </thead>
        <tbody id="dataTableBody"></tbody>
    </table>

    <div class="totals-footer" id="summaryText">
        ০ টি গাছের ০ টি পিস = মোট ঘনফুট: ০.০০
    </div>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('bfidc_records_v2')) || [];

    function handleEnter(e, nextId) {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById(nextId).focus();
        }
    }

    function handleEnterLength(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            addNewSize();
        }
    }

    function updateHeader() {
        document.getElementById('gardenLabel').innerText = document.getElementById('gardenInput').value || '........';
        document.getElementById('sutraLabel').innerText = document.getElementById('sutraInput').value || '........';
        document.getElementById('dateLabel').innerText = document.getElementById('dateInput').value || '........';
        document.getElementById('truckLabel').innerText = document.getElementById('truckInput').value || '........';
    }

    function truncateToTwoDecimals(num) {
        return (Math.floor(num * 100) / 100).toFixed(2);
    }

    function addNewSize() {
        const pNoField = document.getElementById('pieceNo');
        const girthField = document.getElementById('girth');
        const lengthField = document.getElementById('length');

        const pNo = pNoField.value.trim();
        const g = parseFloat(girthField.value);
        const l = parseFloat(lengthField.value);

        if (!pNo || isNaN(g) || isNaN(l)) {
            alert('সঠিক মাপ দিন');
            return;
        }

        const rawCft = (g * g * l) / 2304;
        const formattedCft = truncateToTwoDecimals(rawCft);

        records.push({ pNo, size: `${g}"×${l}'`, cft: formattedCft });

        let parts = pNo.split('/');
        if (parts.length === 2 && !isNaN(parts[1])) {
            pNoField.value = parts[0] + '/' + (parseInt(parts[1]) + 1);
        }

        girthField.value = '';
        lengthField.value = '';
        pNoField.focus();

        saveAndRender();
    }

    function removeRow(idx) {
        records.splice(idx, 1);
        saveAndRender();
    }

    function clearList() {
        if (confirm('সব ডাটা মুছে ফেলতে চান?')) {
            records = [];
            saveAndRender();
        }
    }

    function saveAndRender() {
        localStorage.setItem('bfidc_records_v2', JSON.stringify(records));
        const tbody = document.getElementById('dataTableBody');
        tbody.innerHTML = '';

        let totalCft = 0;
        const treeSet = new Set();
        const half = Math.ceil(records.length / 2);
        const rowCount = Math.max(half, 40); 

        for (let i = 0; i < rowCount; i++) {
            const left = records[i] || null;
            const right = records[i + rowCount] || null;

            if (!left && !right && i >= records.length) break;

            tbody.innerHTML += `<tr>
                <td>${left ? (i + 1) : ''} ${left ? `<button class="del-btn" onclick="removeRow(${i})">×</button>` : ''}</td>
                <td>${left ? left.pNo : ''}</td>
                <td>${left ? left.size : ''}</td>
                <td>${left ? left.cft : ''}</td>
                <td>${right ? (i + rowCount + 1) : ''} ${right ? `<button class="del-btn" onclick="removeRow(${i+rowCount})">×</button>` : ''}</td>
                <td>${right ? right.pNo : ''}</td>
                <td>${right ? right.size : ''}</td>
                <td>${right ? right.cft : ''}</td>
                <td></td>
            </tr>`;
        }

        records.forEach(r => {
            totalCft += parseFloat(r.cft);
            const treeNo = r.pNo.split('/')[0].trim();
            if (treeNo) treeSet.add(treeNo);
        });

        document.getElementById('summaryText').innerText = `${treeSet.size} টি গাছের ${records.length} টি পিস = মোট ঘনফুট: ${totalCft.toFixed(2)}`;
    }

    // ফাইল সেভ অপশন
    function saveDataFile() {
        const data = {
            garden: document.getElementById('gardenInput').value,
            sutra: document.getElementById('sutraInput').value,
            date: document.getElementById('dateInput').value,
            truck: document.getElementById('truckInput').value,
            records: records
        };
        const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `BFIDC_List_${data.garden || 'data'}.json`;
        a.click();
    }

    // ফাইল ওপেন অপশন
    function openDataFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = JSON.parse(e.target.result);
            document.getElementById('gardenInput').value = data.garden || '';
            document.getElementById('sutraInput').value = data.sutra || '';
            document.getElementById('dateInput').value = data.date || '';
            document.getElementById('truckInput').value = data.truck || '';
            records = data.records || [];
            updateHeader();
            saveAndRender();
        };
        reader.readAsText(file);
    }

    window.onload = function() {
        updateHeader();
        saveAndRender();
    };
</script>

</body>
</html>
