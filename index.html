<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFIDC WOOD ERP - SMART EDIT VERSION</title>
    <link href="https://fonts.maateen.me/nikosh/font.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nikosh', sans-serif; }
        body { background: #f0f2f5; padding: 10px; color: #000; }

        /* A4 Setup */
        .wrapper { 
            width: 210mm; 
            min-height: 297mm; 
            margin: 0 auto; 
            background: #fff; 
            padding: 15mm; 
            border: 1px solid #ccc;
            position: relative;
            overflow: hidden;
        }

        /* Watermark Logo Adjust */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; 
            opacity: 0.1; 
            z-index: 0;
            pointer-events: none;
        }

        .header-section { text-align: center; margin-bottom: 10px; position: relative; z-index: 1; }
        .header-section h2 { font-size: 20px; font-weight: bold; text-decoration: underline; }
        
        .meta-info { display: flex; justify-content: space-between; margin-top: 15px; font-size: 17px; font-weight: bold; position: relative; z-index: 1; }
        .meta-info div { flex: 1; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; position: relative; z-index: 1; background: transparent; }
        th, td { border: 1px solid #000; padding: 4px 2px; text-align: center; font-size: 15px; }
        th { background: #e2e2e2; font-weight: bold; }

        /* Input Panel */
        .input-panel { 
            max-width: 950px; margin: 20px auto; background: #fff; padding: 20px; 
            border-radius: 8px; border: 2px solid #1b4332; box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        .input-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .field { flex: 1; min-width: 120px; display: flex; flex-direction: column; }
        .field label { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .field input { padding: 8px; border: 1px solid #999; border-radius: 4px; font-size: 16px; outline: none; }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        button { cursor: pointer; padding: 8px 12px; font-weight: bold; border-radius: 4px; border: none; font-size: 14px; }
        .btn-add { background: #1b4332; color: white; }
        .btn-update { background: #ca8a04 !important; color: white; } /* এডিট মুডের জন্য আলাদা কালার */
        .btn-new-truck { background: #0891b2; color: white; }
        .btn-save { background: #1e40af; color: white; }
        .btn-print { background: #333; color: white; }
        .btn-clear { background: #d90429; color: white; }

        /* Table Action UI */
        .action-btns { display: flex; justify-content: center; gap: 3px; }
        .edit-btn { background: #ca8a04; color: white; font-size: 10px; padding: 2px 5px; border-radius: 2px; cursor: pointer; border: none; }
        .del-btn { background: #ef4444; color: white; font-size: 10px; padding: 2px 5px; border-radius: 2px; cursor: pointer; border: none; }

        /* History */
        .history-section { max-width: 950px; margin: 20px auto; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #94a3b8; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }

        .totals-footer { margin-top: 20px; font-weight: bold; font-size: 18px; border-top: 2px solid #000; padding-top: 10px; position: relative; z-index: 1; }
        #autoSaveStatus { font-size: 12px; color: green; font-weight: bold; margin-top: 5px; }

        @media print {
            .input-panel, .history-section, .action-btns, #autoSaveStatus { display: none !important; }
            body { background: none; padding: 0; }
            .wrapper { border: none; padding: 10mm; width: 100%; margin: 0; }
            @page { size: A4; margin: 0; }
        }
    </style>
</head>
<body>

<div class="input-panel">
    <div class="input-row">
        <div class="field"><label>বাগানের নাম:</label><input type="text" id="gardenInput" value="দাঁতমারা" oninput="updateHeader()"></div>
        <div class="field"><label>সূত্র:</label><input type="text" id="sutraInput" oninput="updateHeader()"></div>
        <div class="field"><label>তারিখ:</label><input type="text" id="dateInput" oninput="updateHeader()"></div>
        <div class="field"><label>ট্রাক নং:</label><input type="text" id="truckInput" oninput="updateHeader()"></div>
    </div>
    <div class="input-row">
        <div class="field"><label>গাছের নম্বর/পিস:</label><input type="text" id="pieceNo" value="1/1" onkeydown="handleEnter(event, 'girth')"></div>
        <div class="field"><label>বেড় (ইঞ্চি):</label><input type="text" id="girth" placeholder="বেড়" onkeydown="handleEnter(event, 'length')"></div>
        <div class="field"><label>লম্বা (ফুট):</label><input type="text" id="length" placeholder="লম্বা" onkeydown="handleEnterLength(event)"></div>
    </div>
    <div class="btn-group">
        <button class="btn-add" id="mainAddBtn" onclick="addNewSize()">+ লিস্টে যোগ করুন</button>
        <button class="btn-new-truck" onclick="archiveTruck()">🚚 ট্রাক আর্কাইভ (নতুন ট্রাক)</button>
        <button class="btn-save" onclick="saveDataFile()">💾 JSON ব্যাকআপ</button>
        <button class="btn-print" onclick="window.print()">🖨️ প্রিন্ট করুন</button>
        <button class="btn-clear" onclick="clearCurrent()">তালিকা ক্লিয়ার</button>
    </div>
    <div id="autoSaveStatus">অটো সেভ সক্রিয়...</div>
</div>

<div class="wrapper">
    <!-- Watermark Logo -->
    <img src="logo.png" class="watermark" alt="BFIDC Logo">

    <div class="header-section">
        <h2>বিএফআইডিসি, <span id="gardenLabel">দাঁতমারা</span> রাবার বাগানের জীবনচক্র হারানো রাবার গাছের পরিমাপকৃত সাইজ লিস্ট</h2>
    </div>
    <div class="meta-info">
        <div>সূত্র : <span id="sutraLabel">........</span></div>
        <div style="text-align: center;">তারিখ: <span id="dateLabel">........</span></div>
        <div style="text-align: right;">ট্রাক নং: <span id="truckLabel">........</span></div>
    </div>
    <table>
        <thead>
            <tr>
                <th style="width: 7%;">ক্রমিক</th><th style="width: 14%;">গাছের নম্বর</th><th style="width: 16%;">পরিমাপ</th><th style="width: 10%;">ঘনফুট</th>
                <th style="width: 7%;">ক্রমিক</th><th style="width: 14%;">গাছের নম্বর</th><th style="width: 16%;">পরিমাপ</th><th style="width: 10%;">ঘনফুট</th>
                <th style="width: 6%;" class="action-btns">এডিট</th>
            </tr>
        </thead>
        <tbody id="dataTableBody"></tbody>
    </table>
    <div class="totals-footer" id="summaryText">০ টি গাছের ০ টি পিস = মোট ঘনফুট: ০.০০</div>
</div>

<div class="history-section">
    <h3 style="border-bottom: 2px solid #333; margin-bottom: 10px;">📜 History (সংরক্ষিত ট্রাক সমূহ)</h3>
    <div id="historyList"></div>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('bfidc_records')) || [];
    let historyLogs = JSON.parse(localStorage.getItem('bfidc_history')) || [];
    let editIndex = null; // কোন সারি এডিট হচ্ছে তা মনে রাখার জন্য

    function toBn(n) {
        if (n === null || n === undefined) return '';
        const bn = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯','/':'/','.':'.'};
        return n.toString().split('').map(char => bn[char] || char).join('');
    }

    function handleEnter(e, nextId) { if (e.key === 'Enter') { e.preventDefault(); document.getElementById(nextId).focus(); } }
    function handleEnterLength(e) { if (e.key === 'Enter') { e.preventDefault(); addNewSize(); } }

    function updateHeader() {
        document.getElementById('gardenLabel').innerText = document.getElementById('gardenInput').value || '........';
        document.getElementById('sutraLabel').innerText = document.getElementById('sutraInput').value || '........';
        document.getElementById('dateLabel').innerText = document.getElementById('dateInput').value || '........';
        document.getElementById('truckLabel').innerText = document.getElementById('truckInput').value || '........';
    }

    function truncateToTwoDecimals(num) { return (Math.floor(num * 100) / 100).toFixed(2); }

    function addNewSize() {
        const pNoField = document.getElementById('pieceNo');
        const gVal = document.getElementById('girth').value;
        const lVal = document.getElementById('length').value;
        const addBtn = document.getElementById('mainAddBtn');
        
        const g = parseFloat(gVal);
        const l = parseFloat(lVal);

        if (!pNoField.value || isNaN(g) || isNaN(l)) return alert('সঠিক মাপ দিন');

        const formattedCft = truncateToTwoDecimals((g * g * l) / 2304);
        const newEntry = { pNo: pNoField.value, gVal: g, lVal: l, size: `${g}"×${l}'`, cft: formattedCft };

        if (editIndex !== null) {
            // যদি এডিট মুডে থাকে, তবে আগের পজিশনেই আপডেট হবে
            records[editIndex] = newEntry;
            editIndex = null;
            addBtn.innerText = "+ লিস্টে যোগ করুন";
            addBtn.classList.remove('btn-update');
        } else {
            // নতুন ডাটা যোগ করার সময় শেষে বসবে এবং পিস নম্বর বাড়বে
            records.push(newEntry);
            let parts = pNoField.value.split('/');
            if (parts.length === 2 && !isNaN(parts[1])) {
                pNoField.value = parts[0] + '/' + (parseInt(parts[1]) + 1);
            }
        }
        
        document.getElementById('girth').value = '';
        document.getElementById('length').value = '';
        pNoField.focus();
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('bfidc_records', JSON.stringify(records));
        const tbody = document.getElementById('dataTableBody');
        tbody.innerHTML = '';
        let totalCft = 0; let treeSet = new Set();
        
        const rowCount = Math.max(Math.ceil(records.length / 2), 40); 
        for (let i = 0; i < rowCount; i++) {
            const left = records[i] || null;
            const right = records[i + rowCount] || null;
            
            tbody.innerHTML += `<tr>
                <td>${left ? toBn(i + 1) : ''}</td>
                <td>${left ? toBn(left.pNo) : ''}</td>
                <td>${left ? toBn(left.size) : ''}</td>
                <td>${left ? toBn(left.cft) : ''}</td>
                <td>${right ? toBn(i + rowCount + 1) : ''}</td>
                <td>${right ? toBn(right.pNo) : ''}</td>
                <td>${right ? toBn(right.size) : ''}</td>
                <td>${right ? toBn(right.cft) : ''}</td>
                <td class="action-btns">
                    ${left ? `<button class="edit-btn" onclick="editRow(${i})">E</button><button class="del-btn" onclick="removeRow(${i})">X</button>` : ''}
                    ${right ? ` | <button class="edit-btn" onclick="editRow(${i + rowCount})">E</button>` : ''}
                </td>
            </tr>`;
        }
        records.forEach(r => { totalCft += parseFloat(r.cft); treeSet.add(r.pNo.split('/')[0]); });
        document.getElementById('summaryText').innerText = `${toBn(treeSet.size)} টি গাছের ${toBn(records.length)} টি পিস = মোট ঘনফুট: ${toBn(totalCft.toFixed(2))}`;
        renderHistory();
    }

    // স্মার্ট এডিট ফাংশন: সারি পরিবর্তন না করেই এডিট করা
    function editRow(idx) {
        const item = records[idx];
        const addBtn = document.getElementById('mainAddBtn');
        
        editIndex = idx; // কোন ইনডেক্স এডিট হচ্ছে তা সেভ রাখা
        document.getElementById('pieceNo').value = item.pNo;
        document.getElementById('girth').value = item.gVal;
        document.getElementById('length').value = item.lVal;
        
        addBtn.innerText = "সংশোধন করুন (Update)";
        addBtn.classList.add('btn-update');
        
        document.getElementById('girth').focus();
    }

    function removeRow(idx) { if(confirm('ডিলিট করবেন?')) { records.splice(idx, 1); saveAndRender(); } }
    
    function clearCurrent() { 
        if (confirm('সব মুছবেন?')) { 
            records = []; editIndex = null;
            document.getElementById('mainAddBtn').innerText = "+ লিস্টে যোগ করুন";
            saveAndRender(); 
        } 
    }

    function archiveTruck() {
        if (records.length === 0) return alert('কোনো ডাটা নেই!');
        const truck = {
            id: Date.now(),
            truckNo: document.getElementById('truckInput').value || 'N/A',
            garden: document.getElementById('gardenInput').value,
            date: document.getElementById('dateInput').value || new Date().toLocaleDateString(),
            data: [...records]
        };
        historyLogs.push(truck);
        localStorage.setItem('bfidc_history', JSON.stringify(historyLogs));
        records = [];
        alert('ট্রাক সংরক্ষিত হয়েছে। গাছের নম্বর আগের সিরিয়ালেই থাকবে।');
        saveAndRender();
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        list.innerHTML = historyLogs.length === 0 ? "কোনো রেকর্ড নেই" : historyLogs.map((h, i) => `
            <div class="history-item">
                <span><b>${toBn(h.truckNo)}</b> - ${h.garden} (${toBn(h.date)})</span>
                <div>
                    <button style="background:#ca8a04; color:white; padding:4px 8px; border-radius:4px; border:none;" onclick="editHistory(${i})">Edit</button>
                    <button style="background:#ef4444; color:white; padding:4px 8px; border-radius:4px; border:none;" onclick="deleteHistory(${i})">Del</button>
                </div>
            </div>
        `).join('');
    }

    function editHistory(index) {
        const h = historyLogs[index];
        if (confirm('এই ট্রাকটি এডিট করতে চান?')) {
            document.getElementById('truckInput').value = h.truckNo;
            document.getElementById('gardenInput').value = h.garden;
            document.getElementById('dateInput').value = h.date;
            records = h.data;
            updateHeader();
            saveAndRender();
        }
    }

    function deleteHistory(index) { if (confirm('মুছে ফেলবেন?')) { historyLogs.splice(index, 1); localStorage.setItem('bfidc_history', JSON.stringify(historyLogs)); renderHistory(); } }

    setInterval(() => {
        localStorage.setItem('bfidc_records', JSON.stringify(records));
        const s = document.getElementById('autoSaveStatus');
        s.innerText = "অটো সেভ: " + toBn(new Date().toLocaleTimeString());
    }, 15000);

    function saveDataFile() {
        const blob = new Blob([JSON.stringify({ records, history: historyLogs })], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `BFIDC_Backup.json`; a.click();
    }

    window.onload = () => { updateHeader(); saveAndRender(); };
</script>

</body>
</html>
