<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFIDC WOOD ERP - PRINT READY</title>
    <link href="https://fonts.maateen.me/nikosh/font.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nikosh', sans-serif; }
        body { background: #f0f2f5; padding: 10px; color: #000; }

        /* A4 Wrapper Setup */
        .wrapper { 
            width: 210mm; 
            min-height: 297mm; 
            margin: 0 auto; 
            background: #fff; 
            padding: 15mm; 
            border: 1px solid #ccc;
            position: relative; /* লোগোকে মাঝখানে রাখার জন্য */
            overflow: hidden;
            display: block;
        }

        /* Watermark Logo - মাঝখানে সেট করার জন্য */
        .watermark {
            position: absolute;
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -50%); /* একদম সেন্টার পয়েন্ট */
            width: 140mm; /* এ৪ পেপারের জন্য আদর্শ সাইজ */
            opacity: 0.12; /* আবছা ভাব (১০-১৫% এর মধ্যে রাখা ভালো) */
            z-index: 0; /* লেখার নিচে থাকবে */
            pointer-events: none;
            -webkit-print-color-adjust: exact; /* প্রিন্টে যেন কালার ঠিক থাকে */
        }

        .header-section { text-align: center; margin-bottom: 10px; position: relative; z-index: 1; }
        .header-section h2 { font-size: 22px; font-weight: bold; text-decoration: underline; }
        
        .meta-info { display: flex; justify-content: space-between; margin-top: 15px; font-size: 18px; font-weight: bold; position: relative; z-index: 1; }
        .meta-info div { flex: 1; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; position: relative; z-index: 1; background: transparent; }
        th, td { border: 1px solid #000; padding: 5px 2px; text-align: center; font-size: 16px; }
        th { background: #e8e8e8 !important; font-weight: bold; -webkit-print-color-adjust: exact; }

        /* Input Panel (প্রিন্টে লুকানো থাকবে) */
        .input-panel { 
            max-width: 950px; margin: 10px auto 20px auto; background: #fff; padding: 20px; 
            border-radius: 8px; border: 2px solid #1b4332; box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        .input-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .field { flex: 1; min-width: 120px; display: flex; flex-direction: column; }
        .field label { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .field input { padding: 8px; border: 1px solid #999; border-radius: 4px; font-size: 16px; outline: none; }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        button { cursor: pointer; padding: 10px 15px; font-weight: bold; border-radius: 4px; border: none; font-size: 14px; }
        .btn-add { background: #1b4332; color: white; }
        .btn-update { background: #ca8a04 !important; color: white; }
        .btn-print { background: #333; color: white; }
        
        .action-btns { display: flex; justify-content: center; gap: 3px; }
        .edit-btn { background: #ca8a04; color: white; font-size: 11px; padding: 2px 6px; border-radius: 3px; border: none; }
        .del-btn { background: #ef4444; color: white; font-size: 11px; padding: 2px 6px; border-radius: 3px; border: none; }

        .totals-footer { margin-top: 25px; font-weight: bold; font-size: 19px; border-top: 2px solid #000; padding-top: 10px; position: relative; z-index: 1; }

        @media print {
            body { background: none; padding: 0; }
            .input-panel, .history-section, .action-btns, #autoSaveStatus { display: none !important; }
            .wrapper { border: none; padding: 10mm; width: 100%; margin: 0; }
            @page { size: A4; margin: 0; }
            .watermark { opacity: 0.15 !important; display: block !important; } /* প্রিন্টে লোগো নিশ্চিত করা */
        }
    </style>
</head>
<body>

<div class="input-panel">
    <div class="input-row">
        <div class="field"><label>বাগানের নাম:</label><input type="text" id="gardenInput" value="দাঁতমারা" oninput="updateHeader()"></div>
        <div class="field"><label>সূত্র:</label><input type="text" id="sutraInput" oninput="updateHeader()"></div>
        <div class="field"><label>তারিখ:</label><input type="text" id="dateInput" oninput="updateHeader()"></div>
        <div class="field"><label>ট্রাক নং:</label><input type="text" id="truckInput" oninput="updateHeader()"></div>
    </div>
    <div class="input-row">
        <div class="field"><label>গাছের নম্বর/পিস:</label><input type="text" id="pieceNo" value="1/1" onkeydown="handleEnter(event, 'girth')"></div>
        <div class="field"><label>বেড় (ইঞ্চি):</label><input type="text" id="girth" onkeydown="handleEnter(event, 'length')"></div>
        <div class="field"><label>লম্বা (ফুট):</label><input type="text" id="length" onkeydown="handleEnterLength(event)"></div>
    </div>
    <div class="btn-group">
        <button class="btn-add" id="mainAddBtn" onclick="addNewSize()">+ লিস্টে যোগ করুন</button>
        <button class="btn-print" onclick="window.print()">🖨️ প্রিন্ট করুন</button>
        <button style="background:#1e40af; color:white" onclick="saveDataFile()">💾 ব্যাকআপ</button>
        <button style="background:#0891b2; color:white" onclick="archiveTruck()">🚚 আর্কাইভ</button>
        <button style="background:#d90429; color:white" onclick="clearCurrent()">মুছুন</button>
    </div>
    <div id="autoSaveStatus" style="font-size:12px; color:green; margin-top:5px;">অটো সেভ সচল...</div>
</div>

<div class="wrapper">
    <!-- Center Logo Watermark -->
    <img src="logo.png" class="watermark" alt="Logo">

    <div class="header-section">
        <h2>বিএফআইডিসি, <span id="gardenLabel">দাঁতমারা</span> রাবার বাগানের জীবনচক্র হারানো রাবার গাছের পরিমাপকৃত সাইজ লিস্ট</h2>
    </div>
    <div class="meta-info">
        <div>সূত্র : <span id="sutraLabel">........</span></div>
        <div style="text-align: center;">তারিখ: <span id="dateLabel">........</span></div>
        <div style="text-align: right;">ট্রাক নং: <span id="truckLabel">........</span></div>
    </div>
    <table>
        <thead>
            <tr>
                <th style="width: 7%;">ক্রমিক</th><th style="width: 14%;">গাছের নম্বর</th><th style="width: 16%;">পরিমাপ</th><th style="width: 10%;">ঘনফুট</th>
                <th style="width: 7%;">ক্রমিক</th><th style="width: 14%;">গাছের নম্বর</th><th style="width: 16%;">পরিমাপ</th><th style="width: 10%;">ঘনফুট</th>
                <th style="width: 6%;" class="action-btns">E</th>
            </tr>
        </thead>
        <tbody id="dataTableBody"></tbody>
    </table>
    <div class="totals-footer" id="summaryText">০ টি গাছের ০ টি পিস = মোট ঘনফুট: ০.০০</div>
</div>

<div class="history-section" style="max-width: 950px; margin: 20px auto; padding:15px; background:#fff; border-radius:8px; border:1px solid #94a3b8;">
    <h3>📜 সংরক্ষিত ট্রাক (History)</h3>
    <div id="historyList"></div>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('bfidc_records')) || [];
    let historyLogs = JSON.parse(localStorage.getItem('bfidc_history')) || [];
    let editIndex = null;

    function toBn(n) {
        if (!n) return n === 0 ? '০' : '';
        const bn = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯','/':'/','.':'.'};
        return n.toString().split('').map(char => bn[char] || char).join('');
    }

    function handleEnter(e, nextId) { if (e.key === 'Enter') { e.preventDefault(); document.getElementById(nextId).focus(); } }
    function handleEnterLength(e) { if (e.key === 'Enter') { e.preventDefault(); addNewSize(); } }

    function updateHeader() {
        document.getElementById('gardenLabel').innerText = document.getElementById('gardenInput').value || '........';
        document.getElementById('sutraLabel').innerText = document.getElementById('sutraInput').value || '........';
        document.getElementById('dateLabel').innerText = document.getElementById('dateInput').value || '........';
        document.getElementById('truckLabel').innerText = document.getElementById('truckInput').value || '........';
    }

    function addNewSize() {
        const pNoField = document.getElementById('pieceNo');
        const gVal = document.getElementById('girth').value;
        const lVal = document.getElementById('length').value;
        const addBtn = document.getElementById('mainAddBtn');
        
        if (!pNoField.value || !gVal || !lVal) return alert('সবগুলো ঘর পূরণ করুন');

        const g = parseFloat(gVal);
        const l = parseFloat(lVal);
        const cft = (Math.floor(((g * g * l) / 2304) * 100) / 100).toFixed(2);
        const entry = { pNo: pNoField.value, gVal: g, lVal: l, size: `${g}"×${l}'`, cft: cft };

        if (editIndex !== null) {
            records[editIndex] = entry;
            editIndex = null;
            addBtn.innerText = "+ লিস্টে যোগ করুন";
            addBtn.style.background = "#1b4332";
        } else {
            records.push(entry);
            let parts = pNoField.value.split('/');
            if (parts.length === 2 && !isNaN(parts[1])) {
                pNoField.value = parts[0] + '/' + (parseInt(parts[1]) + 1);
            }
        }
        
        document.getElementById('girth').value = '';
        document.getElementById('length').value = '';
        pNoField.focus();
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('bfidc_records', JSON.stringify(records));
        const tbody = document.getElementById('dataTableBody');
        tbody.innerHTML = '';
        let totalCft = 0; let treeSet = new Set();
        
        const rowCount = Math.max(Math.ceil(records.length / 2), 40); 
        for (let i = 0; i < rowCount; i++) {
            const left = records[i] || null;
            const right = records[i + rowCount] || null;
            tbody.innerHTML += `<tr>
                <td>${left ? toBn(i + 1) : ''}</td>
                <td>${left ? toBn(left.pNo) : ''}</td>
                <td>${left ? toBn(left.size) : ''}</td>
                <td>${left ? toBn(left.cft) : ''}</td>
                <td>${right ? toBn(i + rowCount + 1) : ''}</td>
                <td>${right ? toBn(right.pNo) : ''}</td>
                <td>${right ? toBn(right.size) : ''}</td>
                <td>${right ? toBn(right.cft) : ''}</td>
                <td class="action-btns">
                    ${left ? `<button class="edit-btn" onclick="editRow(${i})">E</button>` : ''}
                    ${left ? `<button class="del-btn" onclick="removeRow(${i})">X</button>` : ''}
                </td>
            </tr>`;
        }
        records.forEach(r => { totalCft += parseFloat(r.cft); treeSet.add(r.pNo.split('/')[0]); });
        document.getElementById('summaryText').innerText = `${toBn(treeSet.size)} টি গাছের ${toBn(records.length)} টি পিস = মোট ঘনফুট: ${toBn(totalCft.toFixed(2))}`;
        renderHistory();
    }

    function editRow(idx) {
        const item = records[idx];
        const addBtn = document.getElementById('mainAddBtn');
        editIndex = idx;
        document.getElementById('pieceNo').value = item.pNo;
        document.getElementById('girth').value = item.gVal;
        document.getElementById('length').value = item.lVal;
        addBtn.innerText = "সংশোধন (Update)";
        addBtn.style.background = "#ca8a04";
        document.getElementById('girth').focus();
    }

    function removeRow(idx) { if(confirm('ডিলিট করবেন?')) { records.splice(idx, 1); saveAndRender(); } }
    function clearCurrent() { if (confirm('সব মুছবেন?')) { records = []; saveAndRender(); } }

    function archiveTruck() {
        if (records.length === 0) return alert('ডাটা নেই!');
        historyLogs.push({ truckNo: document.getElementById('truckInput').value, garden: document.getElementById('gardenInput').value, date: document.getElementById('dateInput').value, data: [...records] });
        localStorage.setItem('bfidc_history', JSON.stringify(historyLogs));
        records = [];
        saveAndRender();
        alert('আর্কাইভ সম্পন্ন!');
    }

    function renderHistory() {
        const hList = document.getElementById('historyList');
        hList.innerHTML = historyLogs.map((h, i) => `<div style="display:flex; justify-content:space-between; padding:5px; border-bottom:1px solid #eee;"><span>${toBn(h.truckNo)} - ${h.garden} (${toBn(h.date)})</span> <button onclick="editHistory(${i})">Edit</button></div>`).join('');
    }

    function editHistory(idx) {
        const h = historyLogs[idx];
        document.getElementById('truckInput').value = h.truckNo;
        document.getElementById('gardenInput').value = h.garden;
        document.getElementById('dateInput').value = h.date;
        records = h.data;
        updateHeader();
        saveAndRender();
    }

    setInterval(() => {
        localStorage.setItem('bfidc_records', JSON.stringify(records));
        document.getElementById('autoSaveStatus').innerText = "অটো সেভ: " + toBn(new Date().toLocaleTimeString());
    }, 15000);

    function saveDataFile() {
        const blob = new Blob([JSON.stringify({ records, history: historyLogs })], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "BFIDC_Data.json"; a.click();
    }

    window.onload = () => { updateHeader(); saveAndRender(); };
</script>

</body>
</html>
